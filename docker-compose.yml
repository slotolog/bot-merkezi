services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botmerkezi
      POSTGRES_DB: botmerkezi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botmerkezi"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Takip sunucusu. Nginx/Cloudflare arkasındaysa 127.0.0.1 kalsın;
      # doğrudan açmak istersen "8080:8080" yap.
      - "127.0.0.1:8080:8080"
    volumes:
      # Harici botların (A/B modu) veri klasörleri — EXTERNAL_DIRS ile eşleşmeli
      - /opt/haberolog/data:/haberolog
      - /opt/seyahat/data:/seyahat
      - /opt/isharberi/data:/isharberi
    environment:
      EXTERNAL_DIRS: /haberolog,/seyahat,/isharberi
    depends_on:
      db:
        condition: service_healthy
  isharberi:
    # İş Haberleri botu (harici servis, A/B modu). Token Merkez veritabanından okunur.
    build: ./services/isharberi
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      ISHABER_USERNAME: ${ISHABER_USERNAME:-ishaberbot}
    volumes:
      - /opt/isharberi/data:/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
